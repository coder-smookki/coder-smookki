name: Update profile activity

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Generate activity card
        run: python3 scripts/update_activity.py
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit updated card
        run: |
          git add assets/activity.svg assets/activity-mobile.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c commit.gpgsign=false commit -m 'Update README.md'
          git push origin HEAD:main
